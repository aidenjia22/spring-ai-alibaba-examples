<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岗位管理 - 简历分析系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .job-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #e1e8ed;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 1rem;
        }

        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .job-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .job-company {
            color: #667eea;
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .job-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .job-status.active {
            background-color: #d4edda;
            color: #155724;
        }

        .job-status.inactive {
            background-color: #fff3cd;
            color: #856404;
        }

        .job-status.closed {
            background-color: #f8d7da;
            color: #721c24;
        }

        .job-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        .job-info p {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .job-info i {
            color: #667eea;
            width: 16px;
        }

        .job-description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .job-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .job-tag {
            background-color: #f0f2ff;
            color: #667eea;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .job-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .add-job-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .add-job-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 2% auto;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            color: #000;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .list-input {
            margin-bottom: 0.5rem;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .list-item input {
            flex: 1;
        }

        .remove-item {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
        }

        .add-item {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-briefcase"></i>
                <span>岗位管理</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">
                    <i class="fas fa-home"></i> 首页
                </a>
                <a href="/resume" class="nav-link">
                    <i class="fas fa-file-upload"></i> 简历分析
                </a>
                <a href="/management" class="nav-link">
                    <i class="fas fa-list"></i> 简历管理
                </a>
                <a href="/jobs" class="nav-link active">
                    <i class="fas fa-briefcase"></i> 岗位管理
                </a>
            </div>
        </nav>

        <!-- 主要内容 -->
        <main class="main-content">
            <!-- 页面标题 -->
            <section class="page-header">
                <h1><i class="fas fa-briefcase"></i> 岗位管理</h1>
                <p>管理招聘岗位信息，支持岗位发布、编辑和简历匹配</p>
            </section>

            <!-- 统计信息 -->
            <section class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-briefcase"></i>
                        </div>
                        <div class="stat-content">
                            <h3>总岗位数</h3>
                            <span class="stat-value" id="totalJobs">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-content">
                            <h3>活跃岗位</h3>
                            <span class="stat-value" id="activeJobs">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-content">
                            <h3>本月新增</h3>
                            <span class="stat-value" id="newJobs">0</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 搜索和筛选 -->
            <section class="filter-section">
                <div class="filter-card">
                    <div class="filter-row">
                        <div class="filter-item">
                            <label for="searchInput">搜索:</label>
                            <input type="text" id="searchInput" placeholder="按岗位名称或公司名称搜索...">
                        </div>
                        <div class="filter-item">
                            <label for="statusFilter">状态筛选:</label>
                            <select id="statusFilter">
                                <option value="">全部状态</option>
                                <option value="ACTIVE">活跃</option>
                                <option value="INACTIVE">暂停</option>
                                <option value="CLOSED">关闭</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="locationFilter">地点筛选:</label>
                            <select id="locationFilter">
                                <option value="">全部地点</option>
                                <option value="北京">北京</option>
                                <option value="上海">上海</option>
                                <option value="深圳">深圳</option>
                                <option value="杭州">杭州</option>
                                <option value="广州">广州</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="sortBy">排序方式:</label>
                            <select id="sortBy">
                                <option value="createTime">创建时间</option>
                                <option value="title">岗位名称</option>
                                <option value="company">公司名称</option>
                                <option value="updateTime">更新时间</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 岗位列表 -->
            <section class="content-section">
                <!-- 加载状态 -->
                <div id="loadingState" class="loading-state" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>正在加载岗位列表...</p>
                </div>

                <!-- 空状态 -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-briefcase"></i>
                    <h3>还没有岗位信息</h3>
                    <p>点击右下角的按钮创建第一个岗位</p>
                </div>

                <!-- 岗位网格 -->
                <div id="jobGrid" class="job-grid"></div>

                <!-- 分页 -->
                <div id="paginationSection" class="pagination-section" style="display: none;">
                    <button id="prevBtn" class="btn-secondary" onclick="changePage(-1)">
                        <i class="fas fa-chevron-left"></i> 上一页
                    </button>
                    <span id="pageInfo" class="page-info"></span>
                    <button id="nextBtn" class="btn-secondary" onclick="changePage(1)">
                        下一页 <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </section>
        </main>

        <!-- 添加岗位按钮 -->
        <button class="add-job-btn" onclick="openAddJobModal()">
            <i class="fas fa-plus"></i>
        </button>

        <!-- 岗位详情/编辑模态框 -->
        <div id="jobModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeJobModal()">&times;</span>
                <h2 id="modalTitle">岗位详情</h2>
                
                <form id="jobForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="jobTitle">岗位名称 *</label>
                            <input type="text" id="jobTitle" name="title" required>
                        </div>
                        <div class="form-group">
                            <label for="jobCompany">公司名称 *</label>
                            <input type="text" id="jobCompany" name="company" required>
                        </div>
                        <div class="form-group">
                            <label for="jobDepartment">部门</label>
                            <input type="text" id="jobDepartment" name="department">
                        </div>
                        <div class="form-group">
                            <label for="jobLocation">工作地点</label>
                            <input type="text" id="jobLocation" name="location">
                        </div>
                        <div class="form-group">
                            <label for="jobEmploymentType">工作类型</label>
                            <select id="jobEmploymentType" name="employmentType">
                                <option value="FULL_TIME">全职</option>
                                <option value="PART_TIME">兼职</option>
                                <option value="CONTRACT">合同工</option>
                                <option value="INTERN">实习</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="jobExperience">经验要求</label>
                            <input type="text" id="jobExperience" name="experience" placeholder="如：3-5年">
                        </div>
                        <div class="form-group">
                            <label for="jobEducation">学历要求</label>
                            <input type="text" id="jobEducation" name="education" placeholder="如：本科及以上">
                        </div>
                        <div class="form-group">
                            <label for="jobSalaryRange">薪资范围</label>
                            <input type="text" id="jobSalaryRange" name="salaryRange" placeholder="如：15-25K">
                        </div>
                        <div class="form-group">
                            <label for="jobStatus">状态</label>
                            <select id="jobStatus" name="status">
                                <option value="ACTIVE">活跃</option>
                                <option value="INACTIVE">暂停</option>
                                <option value="CLOSED">关闭</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="jobDescription">岗位描述</label>
                        <textarea id="jobDescription" name="description" placeholder="请详细描述岗位职责和要求..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>工作职责</label>
                        <div id="responsibilitiesContainer">
                            <div class="list-item">
                                <input type="text" placeholder="输入工作职责...">
                                <button type="button" class="remove-item" onclick="removeListItem(this)">删除</button>
                            </div>
                        </div>
                        <button type="button" class="add-item" onclick="addListItem('responsibilitiesContainer')">添加职责</button>
                    </div>

                    <div class="form-group">
                        <label>任职要求</label>
                        <div id="requirementsContainer">
                            <div class="list-item">
                                <input type="text" placeholder="输入任职要求...">
                                <button type="button" class="remove-item" onclick="removeListItem(this)">删除</button>
                            </div>
                        </div>
                        <button type="button" class="add-item" onclick="addListItem('requirementsContainer')">添加要求</button>
                    </div>

                    <div class="form-group">
                        <label>技能要求</label>
                        <div id="skillsContainer">
                            <div class="list-item">
                                <input type="text" placeholder="输入技能要求...">
                                <button type="button" class="remove-item" onclick="removeListItem(this)">删除</button>
                            </div>
                        </div>
                        <button type="button" class="add-item" onclick="addListItem('skillsContainer')">添加技能</button>
                    </div>

                    <div class="form-group">
                        <label>福利待遇</label>
                        <div id="benefitsContainer">
                            <div class="list-item">
                                <input type="text" placeholder="输入福利待遇...">
                                <button type="button" class="remove-item" onclick="removeListItem(this)">删除</button>
                            </div>
                        </div>
                        <button type="button" class="add-item" onclick="addListItem('benefitsContainer')">添加福利</button>
                    </div>

                    <div class="form-actions" style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <button type="button" class="btn-secondary" onclick="closeJobModal()">取消</button>
                        <button type="submit" class="btn-primary">保存岗位</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            <p>&copy; 2024 简历分析系统 - 基于Spring AI Alibaba构建</p>
        </footer>
    </div>

    <!-- 脚本文件 -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/job-management.js}"></script>
</body>
</html>
