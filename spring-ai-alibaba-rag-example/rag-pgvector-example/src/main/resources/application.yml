spring:
  application:
    name: rag-pgvector-example

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456

  ai:
    dashscope:
      api-key: sk-f48466cf0ae84a3ead60ffc6a823e1fb
    vectorstore:
      pgvector:
        dimensions: 1536
        index-type: hnsw
        distance-type: cosine_distance

# 简历分析配置
resume:
  analysis:
    # 分析相关配置
    similarity-threshold: 0.6
    top-k: 8
    
    # 支持的文件格式
    supported-formats:
      - pdf
      - doc
      - docx
      - txt
      - rtf
    
    # 文件大小限制 (MB)
    max-file-size: 10
    
    # 文档分片配置
    text-splitter:
      chunk-size: 1000
      chunk-overlap: 200

# 日志配置
logging:
  level:
    com.alibaba.cloud.ai.example.rag: DEBUG
    org.springframework.ai: INFO

# 服务配置
server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 连接超时配置
  tomcat:
    connection-timeout: 300000
    keep-alive-timeout: 300000

# 网络超时配置
rest:
  connect:
    timeout: 300 # 连接超时时间（秒）
  read:
    timeout: 300 # 读取超时时间（秒）
webclient:
  response:
    timeout: 300 # 响应超时时间（秒）
