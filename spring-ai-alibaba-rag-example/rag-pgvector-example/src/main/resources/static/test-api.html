<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { 
            background: #f5f5f5; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .error { background: #ffe6e6; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>API调试测试</h1>
    
    <button onclick="testResumeList()">测试简历列表</button>
    <button onclick="testResumeAnalyze()">测试简历分析</button>
    <button onclick="clearResults()">清空结果</button>
    
    <div id="results"></div>
    
    <script>
        const API_BASE = '/ai/resume';
        
        function log(message) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
        }
        
        function logError(message) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result error';
            div.textContent = `[${new Date().toLocaleTimeString()}] ERROR: ${message}`;
            results.appendChild(div);
        }
        
        async function testResumeList() {
            log('开始测试简历列表API...');
            
            try {
                const response = await fetch(`${API_BASE}/list`);
                log(`响应状态: ${response.status} ${response.statusText}`);
                log(`响应头 Content-Type: ${response.headers.get('content-type')}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    logError(`HTTP ${response.status}: ${errorText}`);
                    return;
                }
                
                const data = await response.json();
                log(`数据类型: ${typeof data}`);
                log(`是否为数组: ${Array.isArray(data)}`);
                log(`数据长度: ${data.length}`);
                log(`原始数据: ${JSON.stringify(data, null, 2)}`);
                
                if (Array.isArray(data) && data.length > 0) {
                    const firstResume = data[0];
                    log(`第一个简历对象: ${JSON.stringify(firstResume, null, 2)}`);
                    log(`resumeId字段: ${firstResume.resumeId}`);
                    log(`resumeId类型: ${typeof firstResume.resumeId}`);
                    log(`resumeId是否为null: ${firstResume.resumeId === null}`);
                    log(`resumeId是否为undefined: ${firstResume.resumeId === undefined}`);
                    log(`resumeId长度: ${firstResume.resumeId ? firstResume.resumeId.length : 'N/A'}`);
                }
                
            } catch (error) {
                logError(`网络错误: ${error.message}`);
            }
        }
        
        async function testResumeAnalyze() {
            log('先获取简历列表...');
            
            try {
                const response = await fetch(`${API_BASE}/list`);
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    const resumeId = data[0].resumeId;
                    log(`使用resumeId进行分析: ${resumeId}`);
                    
                    const analyzeResponse = await fetch(`${API_BASE}/analyze/${resumeId}`);
                    log(`分析响应状态: ${analyzeResponse.status} ${analyzeResponse.statusText}`);
                    
                    if (!analyzeResponse.ok) {
                        const errorText = await analyzeResponse.text();
                        logError(`分析失败: HTTP ${analyzeResponse.status}: ${errorText}`);
                        return;
                    }
                    
                    const analysisResult = await analyzeResponse.json();
                    log(`分析结果: ${JSON.stringify(analysisResult, null, 2)}`);
                } else {
                    logError('没有简历数据可供分析');
                }
                
            } catch (error) {
                logError(`分析测试错误: ${error.message}`);
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // 页面加载时自动测试
        window.addEventListener('load', () => {
            log('页面加载完成，开始自动测试...');
            testResumeList();
        });
    </script>
</body>
</html>
